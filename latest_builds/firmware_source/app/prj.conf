CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

#
# E1 live-stream prototype. The matching application discovers audio and Battery
# services, so offline storage and unused peripheral stacks stay excluded.
#
CONFIG_DISK_ACCESS=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=n
CONFIG_I2S=n
CONFIG_SPI=y


CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_LED=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
