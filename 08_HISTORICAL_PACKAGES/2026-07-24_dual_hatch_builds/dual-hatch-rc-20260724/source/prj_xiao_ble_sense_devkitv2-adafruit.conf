#
# Codecs
#
CONFIG_CODEC_OPUS=y
CONFIG_RING_BUFFER=y

#
# Increase stack and heap sizes
#

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

#
# Live-stream-only candidate. Build 12 discovers only the audio and Battery
# services, so offline storage and unused peripheral stacks stay excluded.
#
CONFIG_DISK_ACCESS=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_LSM6DSL=n
CONFIG_I2S=n
CONFIG_SPI=n

#
# Cable-only recovery. No console, shell, logging backend, management protocol,
# or application data protocol is attached to this CDC endpoint. A host that
# deliberately selects 1200 baud requests the installed Adafruit bootloader's
# UF2 mode through GPREGRET 0x57.
#
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=64
CONFIG_USB_DEVICE_MANUFACTURER="Anticipy"
CONFIG_USB_DEVICE_PRODUCT="Anticipy Recovery"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

#
# =====================================================================
# INTERNAL-RC LOW-FREQUENCY CLOCK VARIANT (dual-hatch-rc-20260724)
# =====================================================================
#
# WHY: the running firmware never brings the BLE radio up. Disassembly puts
# the failure at bt_enable(), and this image's parent inherits the Zephyr
# default LF clock source, the external 32.768 kHz crystal (LFXO):
#
#   zephyr/drivers/clock_control/Kconfig.nrf
#     choice CLOCK_CONTROL_NRF_SOURCE
#       default CLOCK_CONTROL_NRF_K32SRC_XTAL
#
# The board files do NOT pin this - xiao_ble_sense_defconfig is silent on
# K32SRC - so the parent build resolved to CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
# purely by that Kconfig default.
#
# nrf/subsys/mpsl/init/mpsl_init.c forwards the choice straight into MPSL:
#   clock_cfg.source        = m_config_clock_source_get()   -> MPSL_CLOCK_LF_SRC_XTAL
#   clock_cfg.accuracy_ppm  = CONFIG_CLOCK_CONTROL_NRF_ACCURACY
#   clock_cfg.skip_wait_lfclk_started = IS_ENABLED(CONFIG_SYSTEM_CLOCK_NO_WAIT)
#
# CONFIG_SYSTEM_CLOCK_NO_WAIT is NOT set in this application, so
# skip_wait_lfclk_started == false and mpsl_init() WAITS for the LFXO to
# report LFCLKSTARTED. A crystal that never starts is therefore a hard stop
# inside mpsl_init(), which is exactly the "USB alive, radio dead" signature
# observed on the device.
#
# WHAT THIS BLOCK DOES: move the LF clock to the on-die 32.768 kHz RC
# oscillator (LFRC), which has no external component and cannot fail to start.
#
# MPSL's REQUIREMENTS WHEN RC IS THE SOURCE (all read out of the pinned tree,
# not from memory):
#
#  1. Calibration is MANDATORY. nrf/subsys/mpsl/init/mpsl_init.c contains
#       BUILD_ASSERT(IS_ENABLED(CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION),
#         "MPSL requires clock calibration to be enabled when RC is used as LFCLK");
#     This is a compile-time failure, not a runtime one.
#
#  2. The temperature threshold is FIXED. Same file:
#       BUILD_ASSERT(CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_TEMP_DIFF == 2,
#         "MPSL always uses a temperature diff threshold of 0.5 degrees");
#
#  3. The calibration cadence must land on MPSL's recommended values.
#     mpsl_init.c derives them arithmetically:
#       clock_cfg.rc_ctiv      = CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD * 4 / 1000
#       clock_cfg.rc_temp_ctiv = CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP + 1
#     nrfxlib/mpsl/include/mpsl_clock.h defines the targets:
#       MPSL_RECOMMENDED_RC_CTIV       16
#       MPSL_RECOMMENDED_RC_TEMP_CTIV  2
#     and states the application "must ensure calibration at least once every
#     8 seconds to ensure +/-500 ppm clock stability".
#     PERIOD=4000 -> rc_ctiv=16 (4 s temperature poll)
#     MAX_SKIP=1  -> rc_temp_ctiv=2 (forced calibration every 8 s)
#     Both are the Kconfig defaults; they are pinned here explicitly so a
#     future edit cannot silently drift off MPSL's recommendation.
#
#  4. MINIMUM ACCURACY - the documented hard limit.
#     nrfxlib/softdevice_controller/include/sdc.h, sdc_init():
#       @retval -NRF_EPERM  Unable to initialize because
#                             - MPSL is not initialized
#                             - MPSL needs to be configured with a LFCLK
#                               accuracy of 500 ppm or better.
#     CONFIG_CLOCK_CONTROL_NRF_ACCURACY is what gets handed to MPSL and then
#     on to the SoftDevice Controller. Declaring 500 ppm is the largest value
#     the controller will accept, and it is what Kconfig.nrf itself defaults
#     to for RC ("default CLOCK_CONTROL_NRF_K32SRC_500PPM if
#     CLOCK_CONTROL_NRF_K32SRC_RC"). It is set explicitly below.
#
#     Do NOT "improve" this to 250 ppm to match MPSL_DEFAULT_CLOCK_ACCURACY_PPM.
#     accuracy_ppm is a DECLARATION to the peer, not a request: it is what the
#     central uses to size its receive window. Understating the drift of a
#     calibrated LFRC would shrink that window and cause dropped connections.
#     500 ppm is both honest for LFRC and legal for sdc_init().
#
# COST OF THIS VARIANT: higher sleep current (LFRC plus a periodic HFXO-
# referenced calibration every 4-8 s) and a wider connection receive window
# than a healthy crystal would give. Both are acceptable prices for a radio
# that actually comes up.
#
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=4000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=1
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_TEMP_DIFF=2
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
