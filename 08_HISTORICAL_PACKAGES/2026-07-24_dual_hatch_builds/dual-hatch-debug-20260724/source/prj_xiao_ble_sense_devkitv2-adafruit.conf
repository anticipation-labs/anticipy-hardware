#
# Hardware settings
#

CONFIG_GPIO=y
CONFIG_NRFX_PDM=y
CONFIG_ADC=y

#
# Hardware watchdog (wdt0 / alias watchdog0). This pendant has no usable RESET
# button, so the watchdog is the only way a wedged application can restart
# itself. Timeout and feed cadence, and the reasoning behind the deliberately
# long timeout, live in src/watchdog.h.
#
# WDT_DISABLE_AT_BOOT is left at its default so the driver does not try to
# hand this application a watchdog inherited from a previous boot. On nRF52
# the WDT cannot actually be stopped once running, so this is belt-and-braces.
#
CONFIG_WATCHDOG=y

# To flash via dev board
#CONFIG_BUILD_OUTPUT_UF2=n
#CONFIG_USE_DT_CODE_PARTITION=n

#
# Bluetooth settings
#

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Anticipy"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_DEVICE_APPEARANCE=22
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDING_REQUIRED=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

#
# Max transmit power supported by nRF52840
#

CONFIG_BT_CTLR_TX_PWR_ANTENNA=8
CONFIG_BT_PHY_UPDATE=y

#
# Battery and Device Information services
#

CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MODEL="Anticipy Pendant"
CONFIG_BT_DIS_MANUF="Based Hardware"
CONFIG_BT_DIS_FW_REV=n
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="Seeed Xiao BLE Sense"

#
# Large BLE packets / BLE Buffers 
#

CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
# CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=30
CONFIG_BT_BUF_ACL_RX_SIZE=2048
CONFIG_BT_BUF_ACL_TX_SIZE=2048
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

#
# ============================================================================
# DIAGNOSTIC LOGGING IMAGE (dual-hatch-debug-20260724)
# ============================================================================
#
# The shipping dual-hatch image is silent by construction: CONFIG_LOG was off
# and no backend was attached, so the "advertises but never completes a
# connection" fault produced no evidence at all. This variant attaches a text
# log to the USB CDC ACM endpoint that already exists.
#
# ---------------------------------------------------------------------------
# WHY ONE CDC INSTANCE AND NOT TWO -- read before changing any of this.
# ---------------------------------------------------------------------------
# The 1200-baud recovery hatch (src/recovery_usb.c) polls the SAME CDC ACM
# endpoint via uart_line_ctrl_get(). Sharing it with a console is SAFE here,
# and adding a second CDC instance would be strictly more dangerous:
#
#   1. NO SHARED MUTABLE STATE. In the pinned Zephyr 3.4.99 driver
#      (zephyr/subsys/usb/device/class/cdc_acm.c) cdc_acm_line_ctrl_get() is a
#      pure read of dev_data->line_coding.dwDTERate and dev_data->line_state,
#      both written only by the SET_LINE_CODING / SET_CONTROL_LINE_STATE class
#      requests on the control endpoint. Console and log output take a
#      completely disjoint path: cdc_acm_poll_out() -> tx_ringbuf -> tx_work
#      on the USB workqueue. Neither path reads or writes the other's state,
#      so console traffic cannot perturb the hatch's baud/DTR observation.
#
#   2. cdc_acm_poll_out() CANNOT BLOCK OR HANG BOOT. It returns immediately
#      when !dev_data->configured || dev_data->suspended (the character is
#      dropped), and on a full ring buffer it evicts the oldest byte rather
#      than waiting. Because CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n, usb_enable()
#      still happens ONLY inside recovery_usb_start(); early log lines emitted
#      before enumeration are simply discarded. Logging can therefore never
#      delay or deadlock the recovery hatch it shares an endpoint with.
#
#   3. A SECOND INSTANCE WOULD SILENTLY BREAK THE HATCH. recovery_usb.c binds
#      its device with DEVICE_DT_GET_ONE(zephyr_cdc_acm_uart), which expands to
#      DT_COMPAT_GET_ANY_STATUS_OKAY -- "any", not "exactly one". With two
#      instances it would keep compiling and bind to an ARBITRARY one of them,
#      with no diagnostic. It would also make the device enumerate two tty
#      nodes on macOS, so the proven recovery recipe's
#      "--port /dev/cu.usbmodem1101" could address the wrong interface. Both
#      failures are silent, and this is the only software route back in.
#
#   4. THE HATCH CANNOT BE TRIPPED BY A LOG READER. recovery_touch_update()
#      requires baud_rate == 1200 exactly, DTR asserted for the full arming
#      window, and then DTR deasserted. Any normal terminal (115200, or
#      whatever `screen`/`cat` negotiates) resets the state machine on the
#      first sample.
#
#   5. THE BOARD ALREADY INTENDS THIS PAIRING. xiao_ble_common.dtsi chooses
#      zephyr,console = &usb_cdc_acm_uart, and xiao_ble_sense_defconfig
#      already carries "CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y  # Logger cannot use
#      itself to log", which is the recursion guard for exactly this setup.
#
# CONFIG_UART_LINE_CTRL stays explicitly =y below and must be confirmed present
# in the generated autoconf.h before this image is considered valid.
#

CONFIG_LOG=y

#
# DEFERRED, not immediate. CONFIG_LOG_MODE_IMMEDIATE formats and emits inside
# the calling context -- including the Bluetooth RX thread and ISRs -- which is
# exactly the timing we are trying to measure. Deferred keeps formatting on a
# low-priority log thread. Messages are not lost on a crash either: the fatal
# path calls log_panic(), which switches every backend to synchronous mode and
# flushes the pending buffer.
#
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192

#
# Wake the log thread on the first pending message instead of waiting for the
# default batch of 10 / 1000 ms. If the device wedges mid-connection we want
# the last line already on the wire, not sitting in the buffer.
#
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

#
# printk() stays OUT of the log subsystem on purpose. src/transport.c prints
# the GATT registration / bt_enable / settings_load / adv-start return values
# through printk so those specific lines cannot be lost to a full deferred log
# buffer and cannot be reordered behind it.
#
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=n

#
# Console + text log backend on the chosen console device, which the board
# devicetree already points at usb_cdc_acm_uart.
#
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y

#
# 64 bytes was sized for a hatch that never transmits. A console needs room or
# poll_out evicts the oldest byte and shreds every line. Costs 2 x 2048 B of
# RAM (tx + rx ring buffers).
#
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=2048

#
# Application modules register with LOG_MODULE_REGISTER(x, CONFIG_LOG_DEFAULT_LEVEL),
# so DBG here is what makes the application's own LOG_DBG lines compile in.
#
CONFIG_LOG_DEFAULT_LEVEL=4

#
# MANDATORY GUARD: the USB stack logs over the very endpoint it is logging
# about. At the inherited default level of 4 every log line would trigger USB
# transfer logging, which would trigger more log lines -- an unbounded
# feedback loop that would drown the device. The board defconfig already forces
# USB_CDC_ACM off; USB_DEVICE and USB_DRIVER are pinned here as well.
#
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y
CONFIG_USB_DRIVER_LOG_LEVEL_OFF=y

#
# Debug (This value breaks some builds)
#

# CONFIG_ASSERT=y

#
# Bluetooth log levels. BT is the parent module: every BT_* submodule inherits
# its level by default (subsys/logging/Kconfig.template.log_config_inherit), so
# BT=DBG covers hci_core, conn, gatt, att, l2cap, smp, keys, settings and the
# BAS/DIS services. The ones the connection fault actually lives in are pinned
# explicitly so a future inherit-default change cannot silently mute them.
#
# BT_HCI_DRIVER covers bt_sdc_hci_driver (nrf/subsys/bluetooth/controller/
# hci_driver.c), which is the only visibility available into the SoftDevice
# Controller -- CONFIG_BT_LL_SOFTDEVICE=y here, so the link layer itself is a
# closed-source library with no compiled-in logging of its own.
#
CONFIG_BT_LOG_LEVEL_DBG=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_BT_ATT_LOG_LEVEL_DBG=y
CONFIG_BT_L2CAP_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
CONFIG_BT_SETTINGS_LOG_LEVEL_DBG=y
CONFIG_BT_SERVICE_LOG_LEVEL_DBG=y

#
# Deferred logging still builds the cbprintf package on the CALLER's stack, so
# the Bluetooth threads need headroom once every BT module is at DBG.
#
CONFIG_BT_RX_STACK_SIZE=4096
#
# BT_HCI_TX_STACK_SIZE is deliberately NOT set. NCS redeclares it promptless in
# nrf/subsys/bluetooth/controller/Kconfig with "default 1536 if BT_LL_SOFTDEVICE"
# and the comment "derived from other symbols"; assigning it only produces a
# Kconfig warning and is ignored.
#

#
# ANSI colour off: these logs are captured to a file, and escape sequences only
# corrupt the transcript.
#
CONFIG_LOG_BACKEND_SHOW_COLOR=n

#
# Codecs
#
CONFIG_CODEC_OPUS=y
CONFIG_RING_BUFFER=y

#
# Increase stack and heap sizes
#

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

#
# Live-stream-only candidate. Build 12 discovers only the audio and Battery
# services, so offline storage and unused peripheral stacks stay excluded.
#
CONFIG_DISK_ACCESS=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_LSM6DSL=n
CONFIG_I2S=n
CONFIG_SPI=n

#
# Cable recovery. A host that deliberately selects 1200 baud and then drops DTR
# requests the installed Adafruit bootloader's UF2 mode through GPREGRET 0x57.
#
# DIFFERENCE FROM THE SHIPPING IMAGE: this diagnostic build DOES attach a
# console and a text log backend to this same CDC endpoint. No shell, no
# mcumgr/management protocol, and no HCI monitor (zephyr,bt-mon-uart points at
# this device too -- CONFIG_BT_DEBUG_MONITOR_UART must stay off or it would
# seize the endpoint). See the long rationale in the DIAGNOSTIC LOGGING block
# above for why sharing the endpoint cannot disturb the 1200-baud hatch.
#
# CONFIG_CONSOLE / CONFIG_UART_CONSOLE were previously forced =n HERE, below
# the (commented-out) debug block, which meant enabling them further up the
# file would have been silently overridden. They are set =y in the diagnostic
# block above and deliberately not re-stated as =n here.
#
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_MANUFACTURER="Anticipy"
CONFIG_USB_DEVICE_PRODUCT="Anticipy Recovery"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
